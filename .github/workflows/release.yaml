name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  release:
    uses: a1hena/dalamud-plugin-workflows/.github/workflows/release.yaml@v1
    permissions:
      contents: write
    with:
      plugin-name: ARControl
      build-target: ARControl.sln
    secrets:
      PLUGIN_SERVER_API_KEY: ${{ secrets.PLUGIN_SERVER_API_KEY }}
